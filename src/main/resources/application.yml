server:
  address: 127.0.0.1
  port: ${PORT:8096}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%logger{36}] %msg%n%wEx"
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ${NOVEL_LOG_FILE:./data/logs/novel-agent.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
mybatis:
  mapper-locations: classpath:mappers/*.xml
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:file:./data/novel;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  task:
    scheduling:
      pool:
        size: 1
novel:
  neo4j:
    enabled: ${NOVEL_NEO4J_ENABLED:false}
    config-file: ${NOVEL_NEO4J_CONFIG:./config/neo4j-local.json}
    namespace: ${NOVEL_NEO4J_NAMESPACE:novel-agent}
  memory-directory: ${NOVEL_MEMORY_DIRECTORY:./data/books}
  agent-state-directory: ${NOVEL_AGENT_STATE_DIRECTORY:./data/agent-sessions}
  memory-file-bytes: 16000
  memory-entry-bytes: 6000
  review-mode: ${NOVEL_REVIEW_MODE:combined}
  redis:
    enabled: ${NOVEL_REDIS_ENABLED:false}
    address: ${NOVEL_REDIS_ADDRESS:redis://127.0.0.1:6379}
    password: ${NOVEL_REDIS_PASSWORD:}
    key-prefix: ${NOVEL_REDIS_PREFIX:novel-agent}
  workers: 4
  monthly-budget: 300
  max-context-bytes: 120000
  agent-tool-result-bytes: ${NOVEL_TOOL_RESULT_BYTES:24000}
  agent-tool-total-bytes: ${NOVEL_TOOL_TOTAL_BYTES:60000}
  memory-initial-topic-bytes: 16000
  agent-tool-rounds:
    default: 8
    coordinate: 2
  model:
    billing-mode: metered
    endpoint: ${NOVEL_MODEL_ENDPOINT:}
    api-key: ${NOVEL_MODEL_API_KEY:}
    name: ${NOVEL_MODEL_NAME:}
    input-per-million: ${NOVEL_INPUT_PRICE:0}
    output-per-million: ${NOVEL_OUTPUT_PRICE:0}
    max-output-tokens: ${NOVEL_MAX_OUTPUT:8192}
    context-tokens: ${NOVEL_MODEL_CONTEXT_TOKENS:32768}
    prompt-cache-key-enabled: ${NOVEL_PROMPT_CACHE_KEY_ENABLED:false}
    timeout-seconds: 180
    role-timeout-seconds:
      memory: 600
      memory_repair: 600
      check_memory: 300
    requests-per-minute: 30

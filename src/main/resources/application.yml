server:
  address: 127.0.0.1
  port: ${PORT:8096}
logging:
  file:
    name: ${NOVEL_LOG_FILE:./data/logs/novel-agent.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
mybatis:
  mapper-locations: classpath:mappers/*.xml
spring:
  datasource:
    url: jdbc:h2:file:./data/novel;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  task:
    scheduling:
      pool:
        size: 1
novel:
  redis:
    enabled: ${NOVEL_REDIS_ENABLED:false}
    address: ${NOVEL_REDIS_ADDRESS:redis://127.0.0.1:6379}
    password: ${NOVEL_REDIS_PASSWORD:}
    key-prefix: ${NOVEL_REDIS_PREFIX:novel-agent}
  workers: 4
  monthly-budget: 300
  max-context-bytes: 120000
  model:
    billing-mode: metered
    endpoint: ${NOVEL_MODEL_ENDPOINT:}
    api-key: ${NOVEL_MODEL_API_KEY:}
    name: ${NOVEL_MODEL_NAME:}
    input-per-million: ${NOVEL_INPUT_PRICE:0}
    output-per-million: ${NOVEL_OUTPUT_PRICE:0}
    max-output-tokens: ${NOVEL_MAX_OUTPUT:8192}
    timeout-seconds: 180
    requests-per-minute: 30

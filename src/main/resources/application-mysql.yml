spring:
  config:
    import: file:./config/mysql-local.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    clean-disabled: true

# 复制为 application-local.yml，填写真实供应商配置。金额单位为人民币。
# endpoint 支持 /v1 基础地址或完整的 Chat Completions 地址。
# HTTP 仅支持本机地址，远程服务使用 HTTPS。
# 模型需要支持 JSON object、max_tokens 和 usage token 用量。
novel:
  redis:
    enabled: true
    address: redis://127.0.0.1:6379
    key-prefix: novel-agent
  default-provider: default
  model:
    endpoint: ""
    api-key: ""
    name: ""
    input-per-million: 0
    output-per-million: 0
    max-output-tokens: 8192
    requests-per-minute: 30
    billing-mode: metered
# 在 novel.providers 下添加其他服务；每个服务包含 display-name、endpoint、api-key、name。
# billing-mode: unmetered 表示免费调用，仍记录 token 用量。
# billing-mode: metered 需要填写 input-per-million 与 output-per-million。
# 服务地址和凭据仅填写在被 Git 忽略的 application-local.yml 中。
# 支持思考强度的服务配置 reasoning-efforts: [low, medium, high, xhigh, max]。
# reasoning-effort 设置服务默认等级；留空时不发送 reasoning_effort，采用上游默认设置。
# 按服务验证支持的等级后填写列表；未配置列表的服务不显示思考强度选择。
# 可以在 novel.agents 下按角色配置 name 与对应 token 单价。
# 角色：plan、write、rewrite、check-character、check-plot、check-pacing、check-style、reflect、memory、check-memory、research。
# 未单独配置的字段使用 novel.model 中的值。
